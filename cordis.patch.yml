# dsh-qwen38-gateway-compaction — bundle patch.
#
# Registers the plugin on the host's `llm/stream` waterfall and installs its
# process-local fetch wrapper. The config block below is the BASE layer:
# a `qwen38-gateway-compaction:` section in $DSH_HOME/settings.yaml
# overrides it without a restart (see README.md).
- insert:
    - id: qwen38-gateway-compaction
      name: dsh-qwen38-gateway-compaction
      config:
        # Stamp this reasoning effort onto matched calls. "" disables the
        # effort policy (the wire-level layers still apply while configured).
        effort: off
        # Exact model ids the policy applies to (case-sensitive, as declared
        # under llm-pi-ai.providers.<provider>.models[].id in settings.yaml).
        # A call/body whose model is not in this list passes through
        # untouched. Empty list disables the whole policy.
        models: [Qwen3.8-27B-GGUF, qwen3.8-27b]
        # Sampling settings written verbatim into the compaction request body
        # (wire field names; accepted by both llama.cpp and NInfer). These are
        # Qwen3's recommended parameters for non-thinking mode. {} leaves
        # sampling untouched.
        sampling:
          temperature: 0.7
          top_p: 0.8
          top_k: 20
          min_p: 0.0
          presence_penalty: 1.5
          repetition_penalty: 1.0
        # Raise the wire max_tokens of compaction bodies to at least this
        # value (never lowers it) so the summarizer keeps its output budget
        # when pi-ai's client-side context clamp collapses it. 0 disables.
        maxTokensFloor: 16384
        # Models in `models` that are served by an NInfer gateway
        # (ninfer-serve). NInfer rejects `chat_template_kwargs` with a 400,
        # so for these ids the llama.cpp `enable_thinking` merge is skipped
        # and thinking is switched off via `reasoning_effort` (the wire
        # value below) alone.
        ninModels: [qwen3.8-27b]
        # Wire reasoning_effort value written into matched request bodies
        # ("none" is accepted by both llama.cpp build 10798 and NInfer).
        # "" disables this field write (the chat_template_kwargs gate still
        # applies on llama.cpp models).
        wireReasoning: none
        # Merge enable_thinking: false into the body's chat_template_kwargs on
        # matched, non-NInfer request bodies (the primary Qwen3 thinking
        # switch on llama.cpp; skipped for ninModels). false never touches
        # chat_template_kwargs.
        enableThinkingOff: true
        # Oversized-compaction rescue: when a compaction prompt is larger than
        # one call for the target model (e.g. after switching from a 1M-
        # context model to this 250k one), summarize it in chunks and merge,
        # instead of letting dsh report "cannot compact".
        chunking:
          enabled: true
          # Exact model id -> context window (tokens), for both engines.
          # Models not listed here are never chunked (fail open to the
          # single-shot behavior). Set each to the window the gateway actually
          # runs with (llama.cpp: GET /v1/models -> details.n_ctx; NInfer:
          # its n_ctx).
          contextWindows:
            Qwen3.8-27B-GGUF: 262144
            # The NInfer gateway's REAL per-call input ceiling, not its
            # advertised context: 378144 - maxOutput 192000 - 5% margin 18908
            # = 167236 (a larger body is rejected with context_length_exceeded
            # before the model even starts). The old value 369144 made the
            # chunk budget (window x chunkRatio) exceed the gateway limit, so
            # every slice call 400'd and the rescue came back empty.
            qwen3.8-27b: 167236
          # Per-slice input budget as a fraction of the window (0, 1].
          chunkRatio: 0.7
          # Output cap for one partial per-slice summary.
          chunkMaxTokens: 8192
          # Output cap for the final merged checkpoint.
          mergeMaxTokens: 16384
          # Safety cap on partial summaries per rescue; larger ranges fail open.
          maxChunks: 8
        # Manual commands: type /qwen38-compact in any session to compact its
        # history right now (model-summarized, keeps information), or
        # /clear-context for a hard reset (no LLM call, instant, history
        # discarded — environment state untouched). Both work even in agent
        # presets that ship no compaction engine (e.g. the minimal preset).
        # The compact command's summarization call goes through this plugin's
        # wire layers, so
        # thinking stays off and oversized input is chunked automatically.
        command:
          enabled: true
          newContext:
            enabled: true
